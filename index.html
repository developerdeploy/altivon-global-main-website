<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var savedTheme = localStorage.getItem("altivon-theme");
        document.documentElement.dataset.theme =
          savedTheme === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      href="/icons/icon-32.png?v=4"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="/icons/icon-180.png?v=4"
      sizes="180x180"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f7f5f0" />
    <link
      rel="preload"
      href="/fonts/jakarta-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>AltivonGlobal | Moringa Leaf Powder from India</title>
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AltivonGlobal" />
    <meta
      property="og:title"
      content="AltivonGlobal | Moringa Leaf Powder from India"
    />
    <meta
      property="og:description"
      content="B2B sourcing and export coordination for conventional moringa leaf powder from India. Ask about samples, packing and a quotation."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
